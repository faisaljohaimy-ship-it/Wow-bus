  <script>
    /*
     * Pre-paint: apply the saved settings (and ?lang=ar|en) to <html> before the first frame so there is
     * no theme / direction / font flash, and preload the active language's regular font weight.
     * Mirrors js/app.js applySettings() + js/core/i18n.js; keep both in sync (docs/i18n.md §7).
     */
    (function () {
      var root = document.documentElement;
      var s = {};
      try {
        var raw = localStorage.getItem('biltix-hse:v1');
        var saved = raw ? JSON.parse(raw) : null;
        if (saved && saved.settings && typeof saved.settings === 'object') s = saved.settings;
      } catch (e) { /* storage unavailable: defaults */ }
      // English is the default. A saved 'ar' applies only when the user chose it (settings.langChosen, set by any
      // language change); older saved settings without that flag open in English. Mirrors sanitizeSettings() in store.js.
      var lang = s.lang === 'ar' && s.langChosen === true ? 'ar' : 'en';
      try {
        var q = new URLSearchParams(location.search).get('lang');
        if (!q) {
          var h = location.hash, i = h.indexOf('?');
          if (i !== -1) q = new URLSearchParams(h.slice(i + 1)).get('lang');
        }
        if (q === 'en' || q === 'ar') lang = q;
      } catch (e) { /* old browser: keep the saved language */ }
      root.setAttribute('lang', lang);
      root.setAttribute('dir', lang === 'en' ? 'ltr' : 'rtl');
      // Light is the default theme. Dark applies only when the user chose it (settings.themeChosen, set by any
      // theme change); older saved settings without that flag open in light. Mirrors sanitizeSettings() in store.js.
      var theme = s.theme === 'dark' && s.themeChosen === true ? 'dark' : 'light';
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-numerals', s.numerals === 'arab' ? 'arab' : 'latn');
      // settings.calendar → html[data-calendar]: css/base.css hides the clock date line that boot will not fill.
      root.setAttribute('data-calendar', s.calendar === 'gregorian' || s.calendar === 'hijri' ? s.calendar : 'both');
      var ap = s.appearance && typeof s.appearance === 'object' ? s.appearance : {};
      var bg = ap.background === 'static' || ap.background === 'cinematic' ? ap.background : 'subtle';
      root.setAttribute('data-bg', bg);
      root.setAttribute('data-density', ap.density === 'compact' ? 'compact' : 'comfortable');
      var motion = s.motion === 'reduce' || s.motion === 'full' ? s.motion : (s.reducedMotion === true ? 'reduce' : '');
      if (motion) root.setAttribute('data-motion', motion);
      if (lang === 'en') document.title = 'BILTIX Risk AI';
      else document.title = 'بلتكس Risk AI';
      var meta = document.querySelector('meta[name="theme-color"]:not([media])');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#F4F7FB' : '#080F1B');
      // Regular weight of the UI face: the pre-view's lead (the largest text of the first screen) waits for it, so
      // it is fetched first. Arabic needs both subsets of IBM Plex Sans Arabic: the space and Latin letters /
      // digits come from its latin subset (a fallback space would change the line widths, see index.html <main>).
      var fonts = lang === 'en' ? ['plex-sans-latin-400'] : ['plex-arabic-arabic-400', 'plex-arabic-latin-400'];
      for (var fi = 0; fi < fonts.length; fi++) {
        var font = document.createElement('link');
        font.rel = 'preload';
        font.as = 'font';
        font.type = 'font/woff2';
        font.crossOrigin = 'anonymous';
        font.href = 'assets/fonts/' + fonts[fi] + '.woff2';
        document.head.appendChild(font);
      }
      // Home route (#/cockpit): start the explainer hero's poster now (it is the likely LCP image), with the same
      // srcset / sizes as its <img> (js/ui/explainer-hero.js POSTER_SIZES, js/data/explainer-media.js posters).
      // Skipped when the reader minimised the hero.
      try {
        var hh = location.hash;
        var home = !hh || hh === '#' || hh === '#/' || /^#\/cockpit(\?|$)/.test(hh);
        if (home && localStorage.getItem('biltix-hse:explainer:collapsed') !== '1') {
          var pre = document.createElement('link');
          var base = 'assets/video/explainer-' + lang + '-poster';
          pre.rel = 'preload';
          pre.as = 'image';
          pre.type = 'image/webp';
          pre.setAttribute('fetchpriority', 'high');
          pre.setAttribute('imagesrcset', base + '-640.webp 640w, ' + base + '.webp 1280w');
          pre.setAttribute('imagesizes', '(min-width: 1024px) 560px, calc(100vw - 54px)');
          pre.href = base + '.webp';
          document.head.appendChild(pre);
        }
      } catch (e) { /* storage unavailable: the <img> loads the poster itself */ }
    })();
  </script>

     */
    (function () {
      if (document.documentElement.getAttribute('lang') !== 'ar') return;
      var text = {
        brandName: 'بلتكس Risk AI', brandTag: 'قمرة قيادة المخاطر — خمسة مجالات، تصنيف فوري، معالجة مُتتبعة',

      try {
        for (var id in text) {
          var el = document.getElementById(id);
          if (!el) continue;
          // The avatar initial is drawn by CSS from data-initial (css/base.css), so it is not part of the chip's text.
          if (id === 'userAvatar') el.setAttribute('data-initial', text[id]); else el.textContent = text[id];

        if (q('#searchInput')) q('#searchInput').setAttribute('placeholder', 'ابحث بالرمز أو العنوان…');
      } catch (e) { /* js/app.js localises the shell anyway */ }
    })();

  <!-- Activity panel (closed by default below 1680 px; pinnable from 1680 px). A log, not a live region:
       critical alerts are announced once through #liveAnnouncer. -->
  <aside class="activity-panel" id="activityPanel" aria-labelledby="activityTitle" data-state="closed" inert>
    <header class="activity-head feed-head">
      <h2 class="activity-title feed-title" id="activityTitle">Activity</h2>
      <span class="activity-mode" id="activityMode"></span>
      <span class="feed-count mono" id="feedCount"><span class="sr-only" id="feedCountLabel"></span><span id="feedCountValue" aria-hidden="true">0</span></span>
      <div class="activity-actions">
        <button type="button" class="btn btn-ghost btn-sm activity-pause" id="activityPause" aria-pressed="false">
          <span class="live-dot tone-accent" aria-hidden="true"></span>
          <span class="activity-pause-label" id="activityPauseLabel">Pause</span>
        </button>
        <button type="button" class="btn btn-ghost btn-icon activity-pin" id="activityPin" aria-pressed="false" hidden>
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 4h6l-1 6 3 3H7l3-3-1-6z"></path><path d="M12 13v7"></path></svg>
        </button>
        <button type="button" class="btn btn-ghost btn-icon activity-close" id="activityClose">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </header>
    <button type="button" class="activity-new-chip" id="activityNewChip" hidden></button>
    <ul class="feed-list activity-list" id="feedList" role="log" aria-live="off"></ul>
    <footer class="activity-foot feed-foot">
      <span class="feed-status activity-status" id="feedStatus"></span>
      <button type="button" class="btn btn-ghost btn-sm" id="feedAll">View all</button>
    </footer>
  </aside>

  <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>

name: BILTIX source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: biltix-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify BILTIX deployment source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check deployment files in the commit
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            vercel.json
            js/app.js
            sw.js
            tools/stamp-shell.mjs
            tools/sw-precache.mjs
            tests/run.mjs
            api/assistant.mjs
            js/ui/gpt-assistant.js
          )
          for path in "${required[@]}"; do
            object="HEAD:${path}"
            if ! git cat-file -e "$object"; then
              echo "::error file=${path}::Required BILTIX deployment file is missing from the commit"
              exit 1
            fi
            test "$(git cat-file -t "$object")" = blob
            test "$(git cat-file -s "$object")" -gt 0
          done

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Verify generated shell and offline files
        working-directory: .
        run: |
          node tools/stamp-shell.mjs --check
          node tools/sw-precache.mjs --check

      - name: Run BILTIX tests
        working-directory: .
        run: node tests/run.mjs

      - name: Install isolated browser test tools
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/biltix-playwright
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/biltix-qa-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/biltix-qa-tools/node_modules/.bin/playwright" install --with-deps chromium --only-shell

      - name: Check restored routes in the browser
        working-directory: .
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/biltix-playwright
          NODE_PATH: ${{ runner.temp }}/biltix-qa-tools/node_modules
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/biltix-qa"
          node tools/qa.mjs \
            --routes cockpit,airisks,engine,settings,fieldkit,spatial \
            --lang ar,en \
            --theme dark,light \
            --viewport 1440x900,390x844 \
            --wait 3000 \
            --out "$RUNNER_TEMP/biltix-qa" \
            2>&1 | tee "$RUNNER_TEMP/biltix-qa/report.log"

      - name: Preserve browser QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: biltix-browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/biltix-qa/
          if-no-files-found: warn
          retention-days: 7

name: Wow-bus build and security

on:
  pull_request:
    paths: ['src/**', 'public/**', 'tools/runtime-smoke.mjs', 'package*.json', '*config*', 'RELEASE_MANIFEST.json', '.github/workflows/wow-bus-ci.yml']
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'tools/runtime-smoke.mjs', 'package*.json', '*config*', 'RELEASE_MANIFEST.json', '.github/workflows/wow-bus-ci.yml']

permissions:
  contents: read

concurrency:
  group: wow-bus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

name: faisal-security-lab CI

# The extra paths are files outside faisal-security-lab/ that the tests read.
on:
  push:
    branches: [main]
    paths:
      - "faisal-security-lab/**"
      - ".github/workflows/faisal-security-lab-ci.yml"
      - "render.yaml"
      - ".gitignore"
      - ".gitleaksignore"
  pull_request:
    paths:
      - "faisal-security-lab/**"
      - ".github/workflows/faisal-security-lab-ci.yml"
      - "render.yaml"
      - ".gitignore"
      - ".gitleaksignore"

# The job only reads the repository: it uses no secrets and writes nothing back.
permissions:
  contents: read

concurrency:
  group: fsl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faisal-security-lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install the real security tools so the integration tests exercise them.
      # Least privilege for CI: this job has no repository secrets.
      - name: Install security tools
        run: bash scripts/install-tools.sh "$HOME/.local/bin" "$HOME/sectools-venv" || true

      - name: Add tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A tool that could not be installed does not stop the job at this step,
      # but the run then covers less. Say so on the run page.
      - name: Warn about missing tools
        run: |
          for tool in bandit gitleaks pip-audit semgrep; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::warning title=Security tool missing::$tool is not on PATH, so this run covers less: tests that run it are skipped and acceptance gates that depend on it fail."
            fi
          done

      # The command the README and CONTRIBUTING tell people to run.
      - name: Unit + integration tests
        run: make test

      - name: Acceptance gates
        run: python3 scripts/acceptance.py

      - name: Tool readiness (informational)
        run: python3 scripts/verify.py

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: faisal-security-lab/var/acceptance-report.json

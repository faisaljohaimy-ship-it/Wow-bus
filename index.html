<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wow-bus — قائمة الموظفين</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M4 16V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-1 1.73V19a1 1 0 0 1-2 0v-1H7v1a1 1 0 0 1-2 0v-1.27A2 2 0 0 1 4 16zm2-9v5h12V7H6zm1.5 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm9 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
        </svg>
      </span>
      <h1>Wow-bus</h1>
    </div>

    <button
      id="favShortcut"
      class="shortcut-star"
      type="button"
      aria-pressed="false"
      title="عرض المفضلين فقط"
    >
      <svg class="star-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M12 2.5l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17.6l-6.1 3.4 1.5-6.8L2.2 9.5l6.9-.7L12 2.5z"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span class="shortcut-label">المفضلون</span>
      <span id="favCount" class="fav-count">0</span>
    </button>
  </header>

  <main class="container">
    <section class="controls">
      <label class="file-label" for="csvInput">
        <span>اختر ملف CSV</span>
        <input id="csvInput" type="file" accept=".csv" />
      </label>
      <button id="runBtn" class="run-btn" type="button">تشغيل</button>
    </section>

    <section class="hint" id="hint">
      ارفع ملف CSV بصيغة: <code>id,name,dept,trip</code> ثم اضغط تشغيل.
    </section>

    <section id="employees" class="employees" aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>

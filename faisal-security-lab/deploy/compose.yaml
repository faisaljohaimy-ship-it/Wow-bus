# API host + isolated worker(s) sharing a data volume. The worker is where tools
# run; it is resource-bounded and runs as a non-root user.
services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment:
      FSL_OWNER_EMAIL: ${FSL_OWNER_EMAIL:-owner@faisal-security-lab.local}
      FSL_NO_WORKER: "1"
      FSL_ENVIRONMENT: ${FSL_ENVIRONMENT:-lab}
    ports: ["8787:8787"]
    volumes: ["fsl-data:/data"]
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    environment:
      FSL_WORKER_CONCURRENCY: "2"
    volumes: ["fsl-data:/data"]
    # Supported memory isolation for untrusted tool runs:
    mem_limit: 3g
    pids_limit: 512
    cpus: 2.0
    # Minimal kernel capabilities; tools need none of the dangerous ones.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on: [api]

volumes:
  fsl-data:

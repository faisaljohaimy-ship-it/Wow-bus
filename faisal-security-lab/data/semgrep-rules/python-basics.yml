rules:
  - id: python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess call with shell=True can lead to OS command injection when any
      argument is attacker-influenced. Pass an argument list and shell=False.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      references:
        - https://owasp.org/www-community/attacks/Command_Injection
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)

  - id: python-dangerous-eval-exec
    languages: [python]
    severity: ERROR
    message: >-
      Use of eval()/exec() on dynamic input allows arbitrary code execution.
      Avoid eval/exec; parse data explicitly.
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: python-yaml-unsafe-load
    languages: [python]
    severity: WARNING
    message: >-
      yaml.load without SafeLoader can instantiate arbitrary Python objects.
      Use yaml.safe_load().
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
    patterns:
      - pattern: yaml.load($X)

  - id: python-weak-hash-md5
    languages: [python]
    severity: WARNING
    message: >-
      MD5 is cryptographically broken. Use SHA-256 or better for security
      purposes (not for passwords — use a KDF).
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
    patterns:
      - pattern: hashlib.md5(...)

  - id: python-flask-debug-true
    languages: [python]
    severity: WARNING
    message: >-
      Running Flask with debug=True exposes the Werkzeug debugger (RCE) and
      must never be enabled in production.
    metadata:
      cwe: "CWE-489: Active Debug Code"
    patterns:
      - pattern: $APP.run(..., debug=True, ...)

  - id: python-requests-verify-false
    languages: [python]
    severity: ERROR
    message: >-
      Disabling TLS verification (verify=False) allows machine-in-the-middle
      attacks. Keep certificate verification enabled.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
    patterns:
      - pattern-either:
          - pattern: requests.get(..., verify=False, ...)
          - pattern: requests.post(..., verify=False, ...)
          - pattern: requests.request(..., verify=False, ...)

# Fly.io deployment for Faisal Security Lab.
# Deploy from a machine with open network access:
#   cd faisal-security-lab
#   fly launch --no-deploy --copy-config --name <your-app-name>   # or: fly apps create <name>
#   fly volumes create fsl_data --size 1 --region <region>
#   fly secrets set FSL_OWNER_EMAIL=you@example.com FSL_OWNER_PASSWORD=<a-strong-password>
#   fly deploy
# Then open: https://<your-app-name>.fly.dev
app = "faisal-security-lab"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile.fly"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "fsl_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
